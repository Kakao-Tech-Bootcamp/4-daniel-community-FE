name: 4-DANIEL-COMMUNITY-FE

on:
  push:
    branches: ["main"]

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/daniel-community-fe
  CONTAINER_NAME: daniel-community-fe

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 with SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_NAME: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker_password_b64=$(printf '%s' "$DOCKER_PASSWORD" | base64 | tr -d '\n')
          echo "::add-mask::${docker_password_b64}"

          cat > ssm-parameters.json <<JSON
          {
            "commands": [
              "set -eu",
              "trap 'sudo docker logout >/dev/null 2>&1 || true' EXIT",
              "printf '%s' '${docker_password_b64}' | base64 --decode | sudo docker login --username '${DOCKER_USERNAME}' --password-stdin",
              "sudo docker pull ${IMAGE_NAME}",
              "sudo docker stop ${CONTAINER_NAME} || true",
              "sudo docker rm ${CONTAINER_NAME} || true",
              "sudo docker run -d --name ${CONTAINER_NAME} --restart unless-stopped -p 8080:8080 ${IMAGE_NAME}",
              "sudo docker inspect --format='container image={{.Config.Image}} image id={{.Image}}' ${CONTAINER_NAME}",
              "sudo docker inspect --format='{{.Config.Image}}' ${CONTAINER_NAME} | grep -Fx '${IMAGE_NAME}'",
              "sudo docker exec ${CONTAINER_NAME} node -e 'fetch(\"http://127.0.0.1:8080/\").then(response => { if (!response.ok) throw new Error(\"HTTP \" + response.status); return response.text(); }).then(html => { if (!html.includes(\"<title>KTB HUB |\")) throw new Error(\"Unexpected landing page\"); })'"
            ]
          }
          JSON

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy daniel-community-fe Container" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          if ! aws ssm wait command-executed \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"

      - name: Verify public deployment
        env:
          DEPLOY_URL: https://www.daniel-community.cloud/
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
                --max-time 10 \
                --header 'Cache-Control: no-cache' \
                "${DEPLOY_URL}?deploy=${GITHUB_SHA}" \
                | grep -q '<title>KTB HUB |'; then
              echo "Public deployment verified for ${GITHUB_SHA}."
              exit 0
            fi

            echo "Public deployment is not ready yet (${attempt}/12)."
            sleep 5
          done

          echo "Public deployment verification failed for ${GITHUB_SHA}."
          exit 1
