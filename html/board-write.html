<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fee500" />
    <script src="/config.js"></script>
    <link rel="stylesheet" href="/css/board-write.css" crossorigin="anonymous" />
    <title>새 글 작성 | KTB HUB</title>
</head>
<body class="appPage editorPage">
<a class="skipLink" href="#mainContent">본문으로 바로가기</a>
<main class="wrap editorWrap" id="mainContent">
    <header class="editorHeading">
        <p class="editorEyebrow">COMMUNITY POST</p>
        <h1>새로운 이야기를 들려주세요</h1>
        <p>질문, 학습 기록, 동료에게 전하고 싶은 경험을 자유롭게 나눠보세요.</p>
    </header>

    <form class="editorCard" id="postForm" novalidate>
        <div class="inputBox editorField">
            <div class="fieldHeader">
                <label class="fieldLabel" for="title">
                    제목 <span class="requiredMark" aria-hidden="true">*</span>
                </label>
                <span class="characterCount"><strong id="titleCount">0</strong>/26</span>
            </div>
            <input
                class="textInput"
                type="text"
                id="title"
                maxlength="26"
                autocomplete="off"
                placeholder="어떤 이야기인지 한 줄로 알려주세요"
                aria-describedby="editorHelper"
                required
            />
        </div>

        <div class="inputBox editorField">
            <div class="fieldHeader">
                <label class="fieldLabel" for="content">
                    내용 <span class="requiredMark" aria-hidden="true">*</span>
                </label>
                <span class="characterCount"><strong id="contentCount">0</strong>/1500</span>
            </div>
            <textarea
                class="textArea editorTextarea"
                id="content"
                maxlength="1500"
                placeholder="배운 내용이나 궁금한 점을 구체적으로 적어보세요."
                aria-describedby="editorHelper"
                required
            ></textarea>
            <p class="helperText" id="editorHelper" name="content" aria-live="polite"></p>
        </div>

        <div class="inputBox editorField imageField">
            <span class="fieldLabel">이미지</span>
            <label class="uploadZone" for="image">
                <span class="uploadSymbol" aria-hidden="true">+</span>
                <strong>이미지 첨부하기</strong>
                <span>클릭해서 한 장의 이미지를 선택하세요.</span>
            </label>
            <input class="fileInput" type="file" id="image" accept="image/*" />
            <div id="imagePreviewText" class="imagePreviewText" hidden></div>
        </div>

        <div class="editorActions">
            <a class="secondaryButton" href="/html/index.html">취소</a>
            <button class="primaryButton" id="submit" type="submit" disabled>게시하기</button>
        </div>
    </form>
</main>

<div class="background" aria-hidden="true"></div>
<script src="/js/board-write.js" type="module"></script>
</body>
</html>
