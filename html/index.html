<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
        name="description"
        content="부트캠프의 소식과 학생들의 이야기를 나누는 KTB HUB 커뮤니티"
    />
    <meta name="theme-color" content="#fee500" />
    <script src="/config.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
    <title>커뮤니티 | KTB HUB</title>
</head>
<body>
<a class="skipLink" href="#feedContent">게시글 목록으로 바로가기</a>

<main class="wrap feedPage">
    <section class="feedIntro" aria-labelledby="welcomeName">
        <div class="introCopy">
            <p class="introEyebrow">
                <span aria-hidden="true"></span>
                KTB COMMUNITY
            </p>
            <h1 id="welcomeName">동료들의 이야기를 만나보세요.</h1>
            <p class="introDescription">
                부트캠프 생활에 필요한 안내를 확인하고 배운 내용과<br>
                질문을 자유롭게 나누며 함께 성장하는 공간입니다.
            </p>
        </div>

        <aside class="noticeGuide" aria-labelledby="noticeGuideTitle">
            <div class="noticeGuideMark" aria-hidden="true">i</div>
            <div>
                <h2 id="noticeGuideTitle">공지 기능 안내</h2>
                <p>
                    현재는 공지 전용 분류나 상단 고정 없이 작성된 <br>
                    모든 글을 하나의 피드에서 함께 보여드립니다.
                </p>
            </div>
        </aside>
    </section>

    <section class="feedContent" id="feedContent" aria-labelledby="feedTitle">
        <div class="feedHeading">
            <div>
                <p class="sectionEyebrow">COMMUNITY FEED</p>
                <h2 id="feedTitle">최신 이야기</h2>
                <p id="searchSummary" class="searchSummary" hidden></p>
            </div>

            <a
                class="primaryButton writeButton"
                href="/html/board-write.html"
                id="writeLink"
            >
                <span aria-hidden="true">+</span>
                글 작성
            </a>
        </div>

        <form class="searchRow" role="search" novalidate>
            <label class="srOnly" for="searchInput">게시글 검색</label>
            <div class="searchBox">
                <span class="searchIcon" aria-hidden="true"></span>
                <input
                    id="searchInput"
                    class="searchInput"
                    type="search"
                    inputmode="search"
                    autocomplete="off"
                    placeholder="찾고 싶은 게시글을 검색해 보세요"
                    aria-describedby="searchHint"
                />
                <button
                    id="searchClearButton"
                    class="searchClearButton"
                    type="button"
                    aria-label="검색어 지우기"
                    hidden
                >
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <p id="searchHint" class="searchHint">
                검색어를 2글자 이상 입력한 뒤 Enter를 눌러주세요. 비운 채 Enter를 누르면 전체 글을 볼 수 있습니다.
            </p>
        </form>

        <div
            class="boardList"
            aria-busy="false"
        ></div>

        <div
            class="feedState"
            id="feedState"
            role="status"
            aria-live="polite"
        ></div>
    </section>
</main>

<div class="background" aria-hidden="true"></div>
<script src="/js/index.js" type="module"></script>
</body>
</html>
