<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KTB HUB 계정의 비밀번호를 안전하게 변경하세요." />
    <script src="/config.js"></script>
    <link rel="stylesheet" href="../css/login.css" crossorigin="anonymous" />
    <title>비밀번호 수정 | KTB HUB</title>
</head>
<body class="accountPage accountPage--password">
<a class="skipLink" href="#mainContent">본문으로 바로가기</a>
<main class="wrap accountWrap" id="mainContent">
    <div class="accountShell">
        <section class="accountHeading" aria-labelledby="modifyPasswordTitle">
            <p class="sectionLabel">ACCOUNT SECURITY</p>
            <h1 class="title" id="modifyPasswordTitle">비밀번호 수정</h1>
            <p>계정 보호를 위해 다른 서비스에서 사용하지 않는 비밀번호를 권장합니다.</p>
        </section>

        <article class="accountCard accountCard--password">
            <div class="securityNotice">
                <span class="securityIcon" aria-hidden="true">✓</span>
                <div>
                    <h2>안전한 비밀번호를 사용해주세요</h2>
                    <p>영문 대·소문자, 숫자, 특수문자를 모두 포함한 8~20자로 입력하세요.</p>
                </div>
            </div>

            <form
                class="accountForm"
                aria-labelledby="modifyPasswordTitle"
                novalidate
            >
                <div class="inputBox">
                    <label for="currentPw">현재 비밀번호</label>
                    <div class="inputControl">
                        <input
                            type="password"
                            name="currentPw"
                            id="currentPw"
                            placeholder="현재 비밀번호를 입력하세요"
                            autocomplete="current-password"
                            aria-describedby="currentPasswordHelper"
                            required
                        />
                    </div>
                    <p
                        class="helperText"
                        id="currentPasswordHelper"
                        name="currentPw"
                        role="status"
                        aria-live="polite"
                    ></p>
                </div>

                <div class="inputBox">
                    <label for="pw">새 비밀번호</label>
                    <div class="inputControl">
                        <input
                            type="password"
                            name="pw"
                            id="pw"
                            placeholder="새 비밀번호를 입력하세요"
                            autocomplete="new-password"
                            aria-describedby="newPasswordHelper"
                            required
                        />
                    </div>
                    <p
                        class="helperText"
                        id="newPasswordHelper"
                        name="pw"
                        role="status"
                        aria-live="polite"
                    ></p>
                </div>

                <div class="inputBox">
                    <label for="pwck">새 비밀번호 확인</label>
                    <div class="inputControl">
                        <input
                            type="password"
                            name="pw"
                            id="pwck"
                            placeholder="새 비밀번호를 한 번 더 입력하세요"
                            autocomplete="new-password"
                            aria-describedby="newPasswordCheckHelper"
                            required
                        />
                    </div>
                    <p
                        class="helperText"
                        id="newPasswordCheckHelper"
                        name="pwck"
                        role="status"
                        aria-live="polite"
                    ></p>
                </div>

                <div class="buttons accountActions">
                    <button id="signupBtn" type="submit" disabled>비밀번호 변경</button>
                </div>
            </form>
        </article>
    </div>
</main>
<div class="background" aria-hidden="true"></div>
<script src="../js/modifyPassword.js" type="module"></script>
</body>
</html>
