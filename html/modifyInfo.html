<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KTB HUB 프로필과 회원 정보를 관리하세요." />
    <script src="/config.js"></script>
    <link rel="stylesheet" href="../css/login.css" crossorigin="anonymous" />
    <title>회원정보 수정 | KTB HUB</title>
</head>
<body class="accountPage accountPage--profile">
<a class="skipLink" href="#mainContent">본문으로 바로가기</a>
<main class="wrap accountWrap" id="mainContent">
    <div class="accountShell">
        <section class="accountHeading" aria-labelledby="modifyInfoTitle">
            <p class="sectionLabel">MY KTB HUB</p>
            <h1 class="title" id="modifyInfoTitle">회원정보 수정</h1>
            <p>프로필 사진과 커뮤니티에서 사용할 닉네임을 관리하세요.</p>
        </section>

        <article class="accountCard">
            <section class="profileSection" aria-labelledby="profileSectionTitle">
                <div class="profileUploadContainer">
                    <img
                        id="profilePreview"
                        src="/public/profile_default.svg"
                        alt="현재 프로필 사진"
                    />
                    <button
                        type="button"
                        id="removeProfileButton"
                        class="profileRemoveButton"
                        aria-label="프로필 이미지 제거"
                        hidden
                    >
                        ×
                    </button>
                    <label for="profile" class="profileUploadButton">
                        사진 변경
                    </label>
                    <input
                        type="file"
                        name="profile"
                        id="profile"
                        accept="image/*"
                    />
                </div>
                <div class="profileCopy">
                    <h2 id="profileSectionTitle">프로필 사진</h2>
                    <p>JPG, PNG 등 이미지 파일을 사용할 수 있습니다.</p>
                </div>
            </section>

            <form class="accountForm" novalidate>
                <div class="inputBox inputBox--readonly">
                    <span class="fieldLabel" id="emailLabel">이메일</span>
                    <p class="defaultText" id="id" aria-labelledby="emailLabel"></p>
                    <p class="fieldHint">이메일은 변경할 수 없습니다.</p>
                </div>

                <div class="inputBox">
                    <label for="nickname">닉네임</label>
                    <div class="inputControl">
                        <input
                            type="text"
                            name="nickname"
                            id="nickname"
                            placeholder="2~10자의 한글, 영문 또는 숫자"
                            autocomplete="nickname"
                            aria-describedby="nicknameHelper"
                        />
                    </div>
                    <p
                        class="helperText"
                        id="nicknameHelper"
                        name="nickname"
                        role="status"
                        aria-live="polite"
                    ></p>
                </div>

                <div class="buttons accountActions">
                    <button id="signupBtn" type="submit" disabled>변경사항 저장</button>
                    <button id="withdrawBtn" class="dangerTextButton" type="button">
                        회원 탈퇴
                    </button>
                </div>
            </form>

            <div id="toastContainer" aria-live="polite"></div>
        </article>
    </div>
</main>
<div class="background" aria-hidden="true"></div>
<script src="../js/modifyInfo.js" type="module"></script>
</body>
</html>
